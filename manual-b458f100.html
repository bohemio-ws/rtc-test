<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#314d55"><title>RTC · Formación corregida b458f100</title><link rel="stylesheet" href="clean.css?v=b458f100"><style>details{border:1px solid var(--line);border-radius:9px;margin:10px 0;background:#faf0da}summary{padding:14px;font-weight:bold;cursor:pointer}details>div{padding:0 15px 15px;line-height:1.55}.practice{border-left:4px solid #b47921;padding:10px;background:#fff3d7}.back{display:block;text-align:center;text-decoration:none;background:var(--brown);color:#fff7e7;padding:12px;border-radius:7px;margin-bottom:14px}</style></head><body><header><small>BOHEMIO 4 INFINITY · ACADEMY</small><h1>Formación RTC</h1><small>CORRECCIÓN TTS · b458f100</small></header><main><a class="back" href="./">← RTC Academy</a><section class="card"><span class="k">PRUEBA CORREGIDA</span><h2>Pronunciación aeronáutica</h2><p>Esta dirección es nueva y no puede cargar una copia anterior de manual.html.</p></section><div id="lessons"></div></main><script>
const L=[['Fundamentos y escucha','La radio es seguridad, no conversación. Antes de hablar escucha la frecuencia, prepara el mensaje, pulsa PTT, habla con calma y suelta. La llamada identifica destinatario, aeronave, posición e intención.','Ejemplo ficticio: Aeródromo Norte tráfico, EC-RTC, plataforma, salida local. La autoinformación no concede autorizaciones.','Comprueba volumen, frecuencia, micrófono y auriculares. Si no entiendes, solicita repetición. Nunca confundas recibido con autorizado.','Escucha, piensa, pulsa PTT, habla con claridad, suelta y escucha.'],['Alfabeto y números','Alfabeto OACI y pronunciación aeronáutica de indicativos.','El indicativo EC-RTC debe pronunciarse Eco Charlie Romeo Tango Charlie.','No leas el indicativo como una palabra o una secuencia de letras pegadas.','Deletrea EC-RTC y practica pistas 06, 24 y 18.']];
const root=document.querySelector('#lessons');root.innerHTML=L.map((x,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${x[0]}</summary><div><p><b>Conceptos y explicación:</b> ${x[1]}</p><p><b>Aplicación y ejemplos:</b> ${x[2]}</p><p><b>Seguridad y errores frecuentes:</b> ${x[3]}</p><p class="practice"><b>Práctica:</b> ${x[4]}</p><button class="wideBtn" onclick="speakLesson(${i})">🔊 Escuchar explicación</button></div></details>`).join('');
function aviationSpeech(t){return String(t).replace(/EC\s*[-–—]?\s*RTC/gi,'Eco Charlie Romeo Tango Charlie').replace(/\bQNH\b/gi,'Q N H').replace(/\bQFE\b/gi,'Q F E').replace(/\bQDM\b/gi,'Q D M').replace(/\bQDR\b/gi,'Q D R').replace(/\bQTE\b/gi,'Q T E').replace(/\bAFIS\b/gi,'A F I S').replace(/\bPTT\b/gi,'P T T')}
function speakLesson(i){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(aviationSpeech(L[i].slice(0,4).join('. ')));u.lang='es-ES';u.rate=.86;u.pitch=1;const v=speechSynthesis.getVoices().find(x=>/^es(-|_)/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
</script></body></html>
