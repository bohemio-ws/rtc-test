<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#293e49"><title>RTC TEST v3</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#e9dfc9}#badge{position:fixed;z-index:999999;right:6px;bottom:6px;background:#8b1e25;color:white;padding:7px 9px;border-radius:5px;font:bold 12px system-ui;pointer-events:none}</style></head><body><iframe id="rtc" src="https://bohemio-ws.github.io/RTC/rtc-v060.html?v=stable066" allow="microphone"></iframe><div id="badge">TEST v3 · ASR GUARD ACTIVO</div><script>const f=document.getElementById('rtc');f.onload=()=>{const d=f.contentDocument;let t0=0,timer=0;const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ]+/g,' ').trim();function bad(s,sec){const a=norm(s).split(/\s+/).filter(Boolean),n=a.length;if(n<10)return false;const c={};a.forEach(x=>c[x]=(c[x]||0)+1);const top=Math.max(...Object.values(c))/n;let pairs=0,seen={};for(let i=0;i<n-1;i++){let g=a[i]+' '+a[i+1];seen[g]=(seen[g]||0)+1}for(const v of Object.values(seen))if(v>=3)pairs=Math.max(pairs,v*2/n);return top>.25||pairs>.3||(n*60/Math.max(sec,.1))>230}function guard(){const out=d.querySelector('#out'),ta=d.querySelector('#drillText'),st=d.querySelector('#status');if(!out)return;const s=(out.textContent||ta?.value||'').trim(),sec=(performance.now()-t0)/1000;if(!bad(s,sec))return;if(ta)ta.value='';if(st)st.textContent='⚠ TRANSCRIPCIÓN ASR DEGENERADA · INTENTO NO PUNTUADO';const boxes=[...d.querySelectorAll('.feedback')];const b=boxes.at(-1);if(b)b.innerHTML='<h3>Intento no puntuado</h3><p>El reconocedor ha repetido o deformado la transmisión.</p><p><b>No se considera un error del alumno.</b></p>'}function bind(){const p=d.querySelector('#ptt');if(!p||p.dataset.v3)return;p.dataset.v3=1;p.addEventListener('pointerdown',()=>{t0=performance.now();clearTimeout(timer)},true);p.addEventListener('pointerup',()=>{timer=setTimeout(guard,3000)},true)}new MutationObserver(bind).observe(d.documentElement,{subtree:true,childList:true});bind()};</script></body></html>
