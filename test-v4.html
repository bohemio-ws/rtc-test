<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#293e49"><title>RTC TEST v4</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden;background:#e9dfc9}#badge{position:fixed;z-index:999999;right:6px;bottom:6px;background:#087044;color:#fff;padding:7px 9px;border-radius:5px;font:bold 12px system-ui;pointer-events:none}</style></head><body><iframe id="rtc" src="https://bohemio-ws.github.io/RTC/rtc-v059.html?test=v4" allow="microphone"></iframe><div id="badge">TEST v4 · 1 SOLO ASR</div><script>
const frame=document.getElementById('rtc');
frame.onload=()=>{const w=frame.contentWindow,d=frame.contentDocument,SR=w.SpeechRecognition||w.webkitSpeechRecognition;let rec=null,holding=false,t0=0,finalText='',interim='';
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();const norm=s=>clean(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ]+/g,' ').trim();
function q(text,sec){const a=norm(text).split(/\s+/).filter(Boolean),n=a.length;if(!n)return{bad:false,wpm:0,rep:0,n:0};const f={};a.forEach(x=>f[x]=(f[x]||0)+1);const top=Math.max(...Object.values(f))/n;let rep=0;for(let z=2;z<=Math.min(5,Math.floor(n/2));z++){const m={};for(let i=0;i<=n-z;i++){const g=a.slice(i,i+z).join(' ');m[g]=(m[g]||0)+1}for(const [g,c] of Object.entries(m))if(c>=3)rep=Math.max(rep,z*c/n)}const wpm=n*60/Math.max(.1,sec);return{bad:n>=10&&(top>.32||rep>.40||wpm>260),wpm:Math.round(wpm),rep:Math.round(Math.max(top,rep)*100),n}}
function paint(s){const out=d.querySelector('#out'),ta=d.querySelector('#drillText');if(out)out.textContent=s||'Escuchando…';if(ta)ta.value=s}
function finish(){const sec=Math.max(.1,(performance.now()-t0)/1000),text=clean(finalText||interim),quality=q(text,sec),st=d.querySelector('#status'),ta=d.querySelector('#drillText'),b=d.querySelector('#checkDrill');holding=false;const p=d.querySelector('#rtcTestPtt');p?.classList.remove('live');paint(text||'Sin transcripción');if(!text){if(st)st.textContent='No se reconoció texto. No se puntúa.';return}if(quality.bad){if(ta)ta.value='';if(st)st.textContent=`⚠ ASR incoherente (${quality.wpm} palabras/min; repetición ${quality.rep} %). NO se puntúa.`;const fb=d.querySelector('.feedback');if(fb)fb.innerHTML='<h3>Intento no puntuado</h3><p>La transcripción automática no representa de forma fiable el audio.</p>';return}if(ta)ta.value=text;if(w.rtcLastTiming)w.rtcLastTiming={seconds:sec,at:Date.now()};else w.rtcLastTiming={seconds:sec,at:Date.now()};b?.click();if(st)st.textContent='✓ Transcripción recibida · evaluación auxiliar completada.'}
function start(e){e.preventDefault();if(holding)return;if(!SR){const st=d.querySelector('#status');if(st)st.textContent='Este navegador no ofrece reconocimiento de voz.';return}holding=true;t0=performance.now();finalText='';interim='';paint('');e.currentTarget.classList.add('live');const st=d.querySelector('#status');if(st)st.textContent='● TRANSMITIENDO';try{rec=new SR();rec.lang='es-ES';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;rec.onresult=ev=>{let f='',i='';for(let x=ev.resultIndex;x<ev.results.length;x++){const s=clean(ev.results[x][0]?.transcript);if(ev.results[x].isFinal)f+=(f?' ':'')+s;else i+=(i?' ':'')+s}if(f)finalText=clean(finalText+' '+f);interim=i;paint(clean(finalText+' '+interim))};rec.onerror=ev=>{if(!['aborted','no-speech'].includes(ev.error)&&st)st.textContent='Reconocimiento: '+ev.error};rec.onend=()=>{rec=null;if(!holding)finish()};rec.start()}catch(err){holding=false;if(st)st.textContent='No se pudo iniciar reconocimiento.'}}
function stop(e){e.preventDefault();if(!holding)return;holding=false;const st=d.querySelector('#status');if(st)st.textContent='Procesando…';try{rec?.stop()}catch{};setTimeout(()=>{if(rec){try{rec.abort()}catch{}rec=null;finish()}},1200)}
function install(){const old=d.querySelector('#ptt');if(!old||d.querySelector('#rtcTestPtt'))return;old.id='pttOriginalDisabled';old.style.display='none';const p=old.cloneNode(true);p.id='rtcTestPtt';p.style.display='block';p.textContent='PTT';old.parentNode.insertBefore(p,old.nextSibling);p.addEventListener('pointerdown',start);p.addEventListener('pointerup',stop);p.addEventListener('pointercancel',stop)}
new MutationObserver(install).observe(d.documentElement,{childList:true,subtree:true});install();};
</script></body></html>
